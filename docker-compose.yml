# PostgreSQL local para desenvolvimento e testes. Só credenciais de desenvolvimento; porta presa ao localhost.
# Alternativa ao PostgreSQL instalado no sistema (ver docs/backend/README.md).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: archives
      POSTGRES_PASSWORD: archives_dev
      POSTGRES_DB: archives_vi_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - archives_pg:/var/lib/postgresql/data
volumes:
  archives_pg:
